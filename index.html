<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio Digital</title>
<meta name="description" content="Cardápio digital interativo">
<meta name="theme-color" content="#F7F4EA">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip-link" href="#painel-categoria">Pular para o cardápio</a>

<div class="app">

<div class="cabecalho-fixo">
  <!-- TOPBAR: logo + nome + busca -->
  <header class="topbar">
    <div class="topbar__marca">
      <img class="topbar__logo" id="logo-estabelecimento" src="" alt="" width="40" height="40">
      <div class="topbar__nome-bloco">
        <h1 class="topbar__nome" id="nome-estabelecimento">Carregando…</h1>
        <p class="topbar__tagline" id="tagline-estabelecimento"></p>
      </div>
    </div>

    <div class="busca" id="busca-wrapper">
      <svg class="busca__icone" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input
        type="search"
        id="campo-busca"
        class="busca__campo"
        placeholder="Buscar no cardápio…"
        autocomplete="off"
        role="combobox"
        aria-expanded="false"
        aria-controls="busca-resultados"
        aria-label="Buscar item no cardápio">
      <button type="button" class="busca__limpar" id="busca-limpar" hidden aria-label="Limpar busca">×</button>

      <div class="busca__painel" id="busca-resultados" role="listbox" hidden></div>
    </div>
  </header>

  <!-- TABS (mobile) / conteúdo do nav lateral (desktop) -->
  <nav class="nav-categorias" id="nav-categorias" aria-label="Categorias do cardápio">
    <div class="nav-categorias__lista" id="nav-categorias-lista">
      <!-- itens injetados via JS -->
    </div>
  </nav>
</div>

  <!-- CORPO: sidebar (desktop) + painel de categoria ativa -->
  <div class="corpo">
    <aside class="sidebar" aria-label="Navegação de categorias">
      <p class="sidebar__rotulo">Categorias</p>
      <div class="sidebar__lista" id="sidebar-lista">
        <!-- itens injetados via JS -->
      </div>
    </aside>

    <main id="painel-categoria" class="painel">
      <div class="estado-carregando" id="estado-carregando" role="status">
        <span class="estado-carregando__spinner" aria-hidden="true"></span>
        <p>Preparando o cardápio…</p>
      </div>
      <!-- painéis de categoria injetados via JS -->
    </main>
  </div>

</div>

<!-- BOTÃO WHATSAPP FLUTUANTE -->
<a id="botao-whatsapp" class="botao-whatsapp" href="#" target="_blank" rel="noopener" aria-label="Chamar no WhatsApp" hidden>
  <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
    <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.44 1.32 4.94L2.05 22l5.28-1.38a9.87 9.87 0 0 0 4.7 1.2h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm5.8 14.07c-.24.68-1.4 1.3-1.93 1.37-.5.08-1.12.11-1.81-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.15-4.9-4.34-.14-.19-1.17-1.56-1.17-2.98s.75-2.12 1.02-2.41c.26-.28.57-.36.76-.36l.54.01c.17.01.41-.06.64.49.24.57.81 1.98.88 2.12.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.16-.29.36-.42.48-.14.14-.28.28-.12.56.16.28.71 1.17 1.52 1.9 1.05.94 1.93 1.23 2.21 1.37.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.19-.28.37-.23.63-.14.26.09 1.66.78 1.94.93.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/>
  </svg>
</a>

<!-- FOOTER -->
<footer class="footer" id="footer">
  <div class="footer__inner">

    <section class="footer__bloco" aria-labelledby="titulo-pagamentos">
      <h2 id="titulo-pagamentos" class="footer__titulo">Formas de pagamento</h2>
      <ul class="footer__pagamentos" id="lista-pagamentos"></ul>
    </section>

    <section class="footer__bloco" aria-labelledby="titulo-endereco">
      <h2 id="titulo-endereco" class="footer__titulo">Endereço &amp; horário</h2>
      <p class="footer__texto" id="footer-endereco"></p>
      <p class="footer__texto footer__texto--muted" id="footer-horario"></p>
    </section>

    <section class="footer__bloco" aria-labelledby="titulo-contato">
      <h2 id="titulo-contato" class="footer__titulo">Contato</h2>
      <p class="footer__texto"><a id="footer-whatsapp" class="footer__link" href="#">WhatsApp</a></p>
      <p class="footer__texto"><a id="footer-telefone" class="footer__link" href="#">Telefone</a></p>
      <div class="footer__redes" id="footer-redes"></div>
    </section>

  </div>
  <p class="footer__assinatura">Cardápio digital &middot; <span id="footer-ano"></span></p>
</footer>

<script src="script.js"></script>
</body>
</html>
