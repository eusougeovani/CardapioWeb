<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio Digital</title>
<meta name="description" content="Cardápio digital interativo">
<meta name="theme-color" content="#F7F4EA">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip-link" href="#conteudo">Pular para o cardápio</a>

<div class="app">

  <!-- TOPBAR -->
  <header class="topbar">
    <button type="button" class="topbar__marca" id="botao-ir-inicio" aria-label="Ir para a página inicial">
      <img class="topbar__logo" id="logo-estabelecimento" src="" alt="" width="36" height="36">
      <span class="topbar__nome-bloco">
        <span class="topbar__nome" id="nome-estabelecimento">Carregando…</span>
        <span class="topbar__tagline" id="tagline-estabelecimento"></span>
      </span>
    </button>

    <nav class="topbar__nav-desktop" aria-label="Navegação principal">
      <button type="button" class="topbar__link" data-vista="inicio">Início</button>
      <button type="button" class="topbar__link" data-vista="categorias">Categorias</button>
    </nav>

    <div class="topbar__acoes">
      <button type="button" class="botao-icone" id="botao-abrir-busca" aria-label="Buscar no cardápio" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
      </button>
      <a class="botao-avaliar botao-avaliar--desktop" id="link-avaliar-desktop" href="#" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 2.5 14.9 8.6l6.7.9-4.9 4.6 1.3 6.6L12 17.7l-5.9 3 1.3-6.6-4.9-4.6 6.7-.9L12 2.5Z"/></svg>
        <span>Avaliar</span>
      </a>
    </div>
  </header>

  <!-- CONTEÚDO -->
  <main id="conteudo">

    <!-- VISTA: INÍCIO (capa do cardápio) -->
    <section class="vista-inicio" id="vista-inicio">
      <div class="vista-inicio__cartao">
        <img class="vista-inicio__logo" id="capa-logo" src="" alt="" width="88" height="88">
        <h1 class="vista-inicio__nome" id="capa-nome">Carregando…</h1>
        <p class="vista-inicio__tagline" id="capa-tagline"></p>

        <button type="button" class="botao-primario" id="botao-ver-cardapio">Ver cardápio</button>

        <div class="vista-inicio__info">
          <p id="capa-endereco"></p>
          <p id="capa-horario"></p>
        </div>

        <div class="vista-inicio__atalhos" id="capa-atalhos" aria-label="Atalhos de categoria">
          <!-- chips de categoria injetados via JS -->
        </div>
      </div>
    </section>

    <!-- VISTA: CARDÁPIO (grade de categorias + painel de produtos) -->
    <section class="vista-cardapio" id="vista-cardapio" hidden>

      <div class="corpo">
        <aside class="sidebar" aria-label="Navegação de categorias">
          <button type="button" class="sidebar__inicio" id="sidebar-inicio">← Início</button>
          <p class="sidebar__rotulo">Categorias</p>
          <div class="sidebar__lista" id="sidebar-lista"></div>
        </aside>

        <div class="painel" id="painel-categoria">

          <!-- Grade de categorias (visão geral, mobile e desktop na entrada) -->
          <div class="grade-categorias" id="grade-categorias">
            <p class="grade-categorias__titulo">O que você procura hoje?</p>
            <div class="grade-categorias__lista" id="grade-categorias-lista"></div>
          </div>

          <div class="estado-carregando" id="estado-carregando" role="status">
            <span class="estado-carregando__spinner" aria-hidden="true"></span>
            <p>Preparando o cardápio…</p>
          </div>
          <!-- painéis de categoria injetados via JS -->
        </div>
      </div>

    </section>

  </main>

  <!-- BOTTOM NAV (mobile) -->
  <nav class="bottom-nav" aria-label="Navegação principal">
    <button type="button" class="bottom-nav__item" data-vista="inicio">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h5v-5h2v5h5v-9"/></svg>
      <span>Início</span>
    </button>
    <button type="button" class="bottom-nav__item" data-vista="categorias">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.3"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.3"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.3"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.3"/></svg>
      <span>Categorias</span>
    </button>
    <button type="button" class="bottom-nav__item" id="botao-abrir-busca-mobile">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Buscar</span>
    </button>
    <a class="bottom-nav__item" id="link-avaliar-mobile" href="#" target="_blank" rel="noopener" hidden>
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 2.5 14.9 8.6l6.7.9-4.9 4.6 1.3 6.6L12 17.7l-5.9 3 1.3-6.6-4.9-4.6 6.7-.9L12 2.5Z"/></svg>
      <span>Avaliar</span>
    </a>
  </nav>

  <!-- OVERLAY DE BUSCA -->
  <div class="busca-overlay" id="busca-overlay" hidden>
    <div class="busca-overlay__painel" role="dialog" aria-modal="true" aria-label="Buscar no cardápio">
      <div class="busca-overlay__campo-linha">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" class="busca-overlay__icone"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input
          type="search"
          id="campo-busca"
          class="busca-overlay__campo"
          placeholder="Buscar por nome, código ou descrição…"
          autocomplete="off">
        <button type="button" class="botao-icone" id="botao-fechar-busca" aria-label="Fechar busca">×</button>
      </div>
      <div class="busca-overlay__resultados" id="busca-resultados"></div>
    </div>
  </div>

  <!-- MODAL DE PRODUTO -->
  <div class="produto-overlay" id="produto-overlay" hidden>
    <div class="produto-modal" role="dialog" aria-modal="true" aria-labelledby="modal-produto-nome">
      <button type="button" class="produto-modal__fechar" id="botao-fechar-produto" aria-label="Fechar">×</button>
      <img class="produto-modal__imagem" id="modal-produto-imagem" src="" alt="">
      <div class="produto-modal__corpo">
        <span class="produto-modal__codigo" id="modal-produto-codigo"></span>
        <h2 class="produto-modal__nome" id="modal-produto-nome"></h2>
        <div class="produto-modal__tags" id="modal-produto-tags"></div>
        <p class="produto-modal__descricao" id="modal-produto-descricao"></p>
        <p class="produto-modal__detalhes" id="modal-produto-detalhes"></p>
        <div class="produto-modal__rodape">
          <span class="produto-modal__valor" id="modal-produto-valor"></span>
          <a class="botao-primario botao-primario--pequeno" id="modal-produto-whatsapp" href="#" target="_blank" rel="noopener">Pedir no WhatsApp</a>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- FOOTER -->
<footer class="footer" id="footer">
  <div class="footer__inner">

    <section class="footer__bloco" aria-labelledby="titulo-pagamentos">
      <h2 id="titulo-pagamentos" class="footer__titulo">Formas de pagamento</h2>
      <ul class="footer__pagamentos" id="lista-pagamentos"></ul>
    </section>

    <section class="footer__bloco" aria-labelledby="titulo-endereco">
      <h2 id="titulo-endereco" class="footer__titulo">Endereço &amp; horário</h2>
      <p class="footer__texto" id="footer-endereco"></p>
      <p class="footer__texto footer__texto--muted" id="footer-horario"></p>
    </section>

    <section class="footer__bloco" aria-labelledby="titulo-contato">
      <h2 id="titulo-contato" class="footer__titulo">Contato</h2>
      <p class="footer__texto"><a id="footer-whatsapp" class="footer__link" href="#">WhatsApp</a></p>
      <p class="footer__texto"><a id="footer-telefone" class="footer__link" href="#">Telefone</a></p>
      <div class="footer__redes" id="footer-redes"></div>
    </section>

  </div>
  <p class="footer__assinatura">Cardápio digital &middot; <span id="footer-ano"></span></p>
</footer>

<script src="script.js"></script>
</body>
</html>
